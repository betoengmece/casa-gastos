name: Preparar projeto
on:
  push:
    paths:
      - casa-gastos.zip
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: |
          if [ -f casa-gastos.zip ]; then
            unzip -o casa-gastos.zip -d .
            rm casa-gastos.zip
          fi
      - name: Salvar arquivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Adicionar aplicativo Casa"
          git push
